services:
  roadmap-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadmap-ai:latest
    container_name: roadmap-ai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/roadmap.db
      - JWT_SECRET=roadmap-ai-docker-production-secret-2026
    volumes:
      - roadmap-data:/app/data

volumes:
  roadmap-data:
    driver: local
